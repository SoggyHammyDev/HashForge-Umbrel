name: Lint and test

on:
  push:
    branches: [main, feature/standalone-bitcoin-node]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: false # Experimental local-build package is not ready for official-store validation.
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck tests/smoke.sh tools/official-package.sh

      - name: Fetch Umbrel's app linter
        run: |
          git clone --depth 1 https://github.com/getumbrel/umbrel-apps.git "$RUNNER_TEMP/umbrel-apps"
          npm --prefix "$RUNNER_TEMP/umbrel-apps" install --no-audit --no-fund

      - name: Lint the package as the official store would see it
        # Umbrel's linter also checks that every image can be pulled without a login and exists for
        # both Intel/AMD and ARM, and that no port clashes with another app in the store.
        run: |
          tools/official-package.sh "$RUNNER_TEMP/umbrel-apps"
          cd "$RUNNER_TEMP/umbrel-apps"
          npm run lint:apps -- hashforge --check-images

  smoke:
    name: Package starts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Smoke test
        run: tests/smoke.sh

  managed-setup:
    name: Web setup before Bitcoin Core (regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned fork images
        run: |
          git clone https://github.com/SoggyHammyDev/HashForge.git "$RUNNER_TEMP/hashforge-core"
          git -C "$RUNNER_TEMP/hashforge-core" checkout --detach 8b53daea4e11097e8186a855175ebddb37fe29ec
          docker build -t hashforge-managed-pool:ci "$RUNNER_TEMP/hashforge-core"
          docker build -t hashforge-managed-bitcoind:ci "$RUNNER_TEMP/hashforge-core/docker/bitcoind"
      - name: Managed setup smoke test
        run: SMOKE_MANAGED_SETUP=1 tests/smoke.sh

  worker-import:
    name: Browser-requested blockchain import (regtest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned fork images and worker
        run: |
          git clone https://github.com/SoggyHammyDev/HashForge.git "$RUNNER_TEMP/hashforge-core"
          git -C "$RUNNER_TEMP/hashforge-core" checkout --detach 26d667ba5b150259ac989ee5b0aa19dde85de68e
          docker build -t hashforge-managed-pool:ci "$RUNNER_TEMP/hashforge-core"
          docker build -t hashforge-managed-bitcoind:ci "$RUNNER_TEMP/hashforge-core/docker/bitcoind"
          docker build -f "$RUNNER_TEMP/hashforge-core/tools/node/Dockerfile.worker" -t hashforge-setup-worker:ci "$RUNNER_TEMP/hashforge-core/tools/node"
      - name: Browser import smoke test
        run: SMOKE_MANAGED_SETUP=1 SMOKE_WORKER_IMPORT=1 tests/smoke.sh
